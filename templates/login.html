{% extends "base.html" %}

{% block content %}

<div class="card auth-card">

    <h1>Voter Login</h1>

    <p class="subtitle">
        Login to cast your vote
    </p>

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >


        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <p class="bottom-text">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register here</a>
    </p>

</div>

{% endblock %}
